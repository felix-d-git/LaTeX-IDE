# LatexIDE-Server selbst hosten (Linux oder Docker Desktop unter Windows/macOS).
# Einrichtung: siehe docs/INSTALL-DOCKER.md.
#   cp .env.example .env   # ausfuellen
#   mkdir -p data && sudo chown 1000:1000 data   # der Container laeuft als uid 1000 (node);
#                          # gehoert der Ordner root, startet er in einer Absturz-Neustart-Schleife
#                          # (der Server meldet dann "nicht beschreibbar fuer uid <uid>" und beendet sich)
#   docker compose up -d --build
# Eigene Anpassungen (Ports, Limits, Reverse-Proxy-Netz) in docker-compose.override.yml,
# dann bleiben sie bei Updates erhalten.
services:
  app:
    build:
      context: .
      args:
        # apt = TeX Live im Image (Debian, ~5 GB); host = eigenes TeX Live einhaengen (siehe unten)
        TEXLIVE: ${TEXLIVE:-apt}
    image: latex-ide
    restart: unless-stopped
    env_file: .env
    environment:
      DATA_DIR: /app/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes:
      - ${LATEX_DATA_DIR:-./data}:/app/data
      # Nur bei TEXLIVE=host: TeX Live 2025, installiert nach /data/texlive (dieser Pfad ist fest).
      # - /pfad/zu/texlive:/data/texlive:ro
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3077/healthz').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    ports:
      - "${HOST_PORT:-3077}:3077"
