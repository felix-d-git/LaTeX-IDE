# PDF-zu-Code-Sprung mit echtem TeX Live unter Windows (Umlaute, Leerzeichen, Junction),
# dazu die LuaLaTeX-Sandbox (#119, Pfade mit Laufwerksbuchstaben, Windows-Schriften).
# Nur bei Aenderungen daran: die Installation dauert einige Minuten.
name: SyncTeX Windows

on:
  pull_request:
    paths:
      - server/lib/synctex.js
      - server/lib/compile.js
      - server/lib/luaSandbox.lua
      - test/syncLt.test.js
      - test/luaSandbox.test.js
      - .github/workflows/synctex-windows.yml
  workflow_dispatch:

permissions: {}

jobs:
  synctex:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      - name: Abhaengigkeiten installieren
        # Keine Lifecycle-Scripts fremder Pakete (#177); nur esbuild braucht seins.
        run: npm ci --ignore-scripts && npm rebuild esbuild

      - name: TeX Live installieren
        shell: pwsh
        run: |
          $Repo = 'https://ftp.tu-chemnitz.de/pub/tug/historic/systems/texlive/2025/tlnet-final'
          $Tex = 'C:/tl'
          Invoke-WebRequest "$Repo/install-tl.zip" -OutFile install-tl.zip
          # SHA-512 aus install-tl.zip.sha512 der TUG, deren .asc gegen den TeX-Live-Schluessel
          # C78B82D8C79512F79CC0D7C80D5E5D9106BAB6BC geprueft wurde (Repo eingefroren).
          if ((Get-FileHash install-tl.zip -Algorithm SHA512).Hash -ne '4571b00c2ca493b594097355735eb20a07c7ca52871515419ecef4951a59e4d4d24318edd92ccb917a6dc8883366d8930183c8d3173e23d3bd33fdf2a8ca8964'.ToUpper()) { throw 'install-tl.zip: SHA-512 stimmt nicht' }
          Expand-Archive install-tl.zip "$env:RUNNER_TEMP/itl"
          $Dir = (Get-ChildItem "$env:RUNNER_TEMP/itl" -Directory)[0].FullName
          @"
          selected_scheme scheme-basic
          TEXDIR $Tex
          tlpdbopt_install_docfiles 0
          tlpdbopt_install_srcfiles 0
          instopt_adjustpath 0
          tlpdbopt_desktop_integration 0
          tlpdbopt_file_assocs 0
          "@ -replace '(?m)^\s+', '' | Set-Content tl.profile -Encoding ascii
          & "$Dir/install-tl-windows.bat" -no-gui -profile tl.profile -repository $Repo
          & "$Tex/bin/windows/tlmgr.bat" install latexmk synctex luaotfload
          "$Tex/bin/windows" | Out-File $env:GITHUB_PATH -Append -Encoding utf8

      - name: Test
        env:
          REQUIRE_TEX: '1'
        run: node --test test/syncLt.test.js

      - name: Test LuaLaTeX-Sandbox
        env:
          REQUIRE_TEX: '1'
        run: node --test test/luaSandbox.test.js
