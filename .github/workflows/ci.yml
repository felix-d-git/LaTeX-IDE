# Tests + Client-Build bei jedem Push und Pull Request. Ohne TeX im Runner:
# die latexmk-Tests ueberspringen sich selbst (hasTex), der Rest laeuft voll.
name: CI

on:
  push:
  pull_request:

permissions: {}

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 26
          cache: npm

      - name: Abhaengigkeiten installieren
        # Keine Lifecycle-Scripts fremder Pakete (#177); nur esbuild braucht seins.
        run: npm ci --ignore-scripts && npm rebuild esbuild

      - name: Client bauen
        run: npm run build:client

      - name: Tests
        run: npm test
