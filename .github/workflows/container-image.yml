# SPDX-FileCopyrightText: 2026 felix-d-git and LaTeX-IDE contributors
# Baut bei jedem Release das Server-Image (docker-compose.yml, TEXLIVE=apt, mit pandoc) und
# prueft, dass der Container startet, latexmk findet und die Lizenzdateien mitbringt.
# Veroeffentlicht wird es unter ghcr.io/<owner>/latex-ide nur, wenn das Repo oeffentlich
# ist (privat braeuchte jeder Nutzer einen Registry-Login, und das Paketkontingent reicht nicht
# fuer ~5 GB), und nur bei einem regulaeren Release oder einem manuellen Start auf master.
# :latest und :<version> bekommt nur ein regulaeres Release; ein manueller Start pusht
# :<version>-<commit> und haengt seine Dateien unter diesem Namen an, ueberschreibt also nichts vom Release.
# pandoc bringt statisch gelinkte Haskell-Bibliotheken (u. a. GPL-2.0+) mit: deren Debian-Quellpakete
# gehen als pandoc-sources-<tag>.tar ans Release, die Quellen aller uebrigen Debian-Pakete im Image als
# debian-sources-<tag>.tar.partNN, beides bevor das Image gepusht wird (docs/INSTALL-DOCKER.md).
name: Container-Image

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      # Release-Image nachholen (z. B. nach dem Oeffentlich-Schalten): baut den Tag, pusht :<version> + :latest.
      tag:
        description: 'Optional: Tag vX.Y.Z nachholen (leer = :<version>-<commit> von master)'
        required: false
  # Aufruf aus release.yml nach dem Veroeffentlichen (GITHUB_TOKEN-Releases loesen kein release-Event aus).
  workflow_call:
    inputs:
      tag:
        type: string
        required: true

permissions:
  contents: write   # Paketliste als Release-Asset
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.event.release.tag_name }}
      # nicht-leer = Lauf gehoert zu einem Release (Event "release" oder Aufruf aus release.yml)
      RELEASE_RUN: ${{ (github.event_name == 'release' || inputs.tag != '') && 'true' || '' }}
      PUBLISH: ${{ github.event.repository.private == false && ((github.event_name == 'release' && !github.event.release.prerelease) || inputs.tag != '' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master')) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || '' }}

      - name: Image bauen
        run: |
          VER=$(node -p "require('./package.json').version")
          if [ -n "$RELEASE_RUN" ] && [ "v$VER" != "$TAG" ]; then
            echo "Tag $TAG passt nicht zu package.json ($VER)"; exit 1
          fi
          # Link auf den Tag bzw. Commit, nicht auf master; hoechstens 512 Zeichen.
          DESC="Web-IDE fuer LaTeX-Projekte mit Live-Zusammenarbeit (AGPL-3.0-only). Enthaelt Debian-Pakete unter eigenen Lizenzen (u. a. GPL, LGPL, AGPL), Liste unter /app/DEBIAN-PACKAGES.txt. Lizenzhinweise und Quellcode-Angebot: https://github.com/$GITHUB_REPOSITORY/blob/${TAG:-$GITHUB_SHA}/docs/INSTALL-DOCKER.md#drittsoftware-im-docker-image"
          [ ${#DESC} -le 512 ] || { echo "Beschreibung zu lang (${#DESC} Zeichen)"; exit 1; }
          # /source zeigt auf genau den gebauten Stand: Release-Tag bzw. Commit (manueller Start, Forks).
          if [ -n "$RELEASE_RUN" ]; then REF=$TAG; else REF=$GITHUB_SHA; fi
          SRC="https://github.com/$GITHUB_REPOSITORY/tree/$REF"
          echo "SOURCE_URL=$SRC" >> "$GITHUB_ENV"
          docker build --pull --no-cache --build-arg PANDOC=1 \
            --build-arg SOURCE_URL="$SRC" \
            --build-arg IMAGE_SOURCE="https://github.com/$GITHUB_REPOSITORY" \
            --build-arg IMAGE_AUTHORS="${GITHUB_REPOSITORY%%/*}" \
            --label "org.opencontainers.image.version=$VER" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.description=$DESC" \
            -t latex-ide:test .

      - name: Container starten und pruefen
        run: |
          docker run -d --name ide -p 3077:3077 latex-ide:test
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3077/api/auth/me || true)
            [ "$code" = "401" ] && break
            sleep 2
          done
          docker logs ide
          [ "$code" = "401" ] || { echo "Server antwortet nicht (HTTP $code)"; exit 1; }
          docker exec ide latexmk -v
          # AGPL §13: /source fuehrt auf den Quellcode genau dieses Images
          loc=$(curl -s -o /dev/null -w '%{redirect_url}' http://localhost:3077/source)
          [ "$loc" = "$SOURCE_URL" ] || { echo "/source zeigt auf '$loc' statt '$SOURCE_URL'"; exit 1; }
          # Node-Mindestversion (Sicherheitsfix 24.22.1)
          docker exec ide node -e "const [a,b,c]=process.versions.node.split('.').map(Number); console.log('node', process.version); process.exit(a>24||(a==24&&(b>22||(b==22&&c>=1)))?0:1)"

      - name: Lizenzdateien und Inhalt pruefen
        shell: bash   # mit pipefail: ein Fehler von docker save bricht ab
        run: |
          docker run --rm --user root latex-ide:test sh -c '
            fail() { echo "Selbstpruefung: $*"; exit 1; }
            test -s /app/DEBIAN-PACKAGES.txt || fail "DEBIAN-PACKAGES.txt fehlt oder ist leer"
            test -s /app/LICENSE || fail "LICENSE fehlt"
            test -s /app/THIRD_PARTY_NOTICES.md || fail "THIRD_PARTY_NOTICES.md fehlt"
            grep -q "Schriftliches Angebot" /app/docs/INSTALL-DOCKER.md || fail "Quellcode-Angebot fehlt"
            for p in @napi-rs @esbuild esbuild; do test ! -e /app/node_modules/$p || fail "node_modules/$p im Image"; done
            # Teile mit eigenen Lizenzen, die THIRD_PARTY_NOTICES nicht abdeckt (STRIPPED in scripts/licenses.js)
            for p in cmaps standard_fonts legacy image_decoders web types build/pdf.sandbox*; do
              ! ls -d /app/node_modules/pdfjs-dist/$p >/dev/null 2>&1 || fail "node_modules/pdfjs-dist/$p im Image"
            done
            test ! -e /root/.npm || fail "/root/.npm im Image"
            command -v pandoc >/dev/null || fail "pandoc fehlt"
            echo "Selbstpruefung ok"
          '
          # Geloeschte Dateien stecken weiter in tieferen Layern: jeden Layer einzeln durchsuchen.
          # Jeder Layer aus manifest.json muss gelesen worden sein (sonst z. B. unbekanntes Format).
          docker save latex-ide:test | python3 -c '
          import json, os, re, sys, tarfile
          bad = re.compile(r"(^|/)(node_modules/(@napi-rs|@esbuild|esbuild)|root/\.npm)(/|$)")
          hits, done, links, layers = set(), set(), {}, []
          image = tarfile.open(fileobj=sys.stdin.buffer, mode="r|")
          for member in image:
              if member.issym():
                  links[member.name] = os.path.normpath(os.path.join(os.path.dirname(member.name), member.linkname))
              if not member.isfile():
                  continue
              f = image.extractfile(member)
              if member.name == "manifest.json":
                  layers = [l for m in json.load(f) for l in m["Layers"]]
                  continue
              try:
                  hits.update(e.name for e in tarfile.open(fileobj=f, mode="r|*") if bad.search(e.name.replace(".wh.", "")))
              except tarfile.ReadError as e:
                  if str(e) != "empty file":
                      continue  # config/index, kein Layer
              done.add(member.name)
          missing = sorted({l for l in layers if links.get(l, l) not in done})
          for name in sorted(hits)[:20]:
              print("In einem Layer:", name)
          for name in missing or ([] if layers else ["manifest.json fehlt"]):
              print("Nicht geprueft:", name)
          print(len(set(layers)) - len(missing), "Layer geprueft")
          sys.exit(1 if hits or missing or not layers else 0)
          '

      # Laeuft immer (auch privat), damit ein Fehler vor dem ersten Push auffaellt.
      - name: pandoc-Quellen sammeln
        run: |
          TAG=${TAG:-v$(node -p "require('./package.json').version")}
          # Manueller Start: eigener Name, sonst ueberschriebe er Image-Tag und Dateien des Releases.
          ASSET=$TAG
          [ -n "$RELEASE_RUN" ] || ASSET="$TAG-${GITHUB_SHA::7}"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "ASSET=$ASSET" >> "$GITHUB_ENV"
          docker run --rm latex-ide:test cat /app/DEBIAN-PACKAGES.txt > "DEBIAN-PACKAGES-$ASSET.txt"
          # pandoc + statisch gelinkte Haskell-Bibliotheken laut offizieller buildinfo
          python3 scripts/pandoc-sources.py "DEBIAN-PACKAGES-$ASSET.txt" > pandoc-sources.txt
          wc -l pandoc-sources.txt
          mkdir -p "$RUNNER_TEMP/src"
          cp pandoc-sources.txt "$RUNNER_TEMP/src/SOURCES.txt"
          # Erst das Archiv der Distribution, sonst snapshot.debian.org (debsnap)
          docker run --rm -v "$RUNNER_TEMP/src:/out" debian:bookworm bash -euo pipefail -c '
            sed -i "s/^Types: deb$/Types: deb deb-src/" /etc/apt/sources.list.d/debian.sources
            apt-get update -qq
            apt-get install -y -qq --no-install-recommends devscripts libwww-perl liblwp-protocol-https-perl libjson-perl ca-certificates >/dev/null
            cd /out
            while read -r src ver; do
              apt-get source -qq --download-only "$src=$ver" </dev/null >/dev/null \
                || debsnap -f -d . "$src" "$ver" </dev/null \
                || { echo "Quelle nicht gefunden: $src $ver"; exit 1; }
            done < SOURCES.txt
            n=$(ls *.dsc | wc -l)
            [ "$n" -eq "$(wc -l < SOURCES.txt)" ] || { echo "$n .dsc fuer $(wc -l < SOURCES.txt) Quellpakete"; exit 1; }
          '
          tar -cf "pandoc-sources-$ASSET.tar" -C "$RUNNER_TEMP/src" .
          ls -lh "pandoc-sources-$ASSET.tar"
          rm -rf "$RUNNER_TEMP/src"

      # GPLv3/AGPLv3 §6(d): Quellen aller Debian-Pakete im Image selbst bereithalten, nicht nur
      # ueber snapshot.debian.org. Mehrere GB, daher auf /mnt (zweite Platte des Runners) und in
      # Teilen unter der Asset-Grenze von 2 GiB.
      - name: Debian-Quellen sammeln
        run: |
          python3 scripts/debian-sources.py "DEBIAN-PACKAGES-$ASSET.txt" > debian-sources.txt
          echo "::notice::$(wc -l < debian-sources.txt) Debian-Quellpakete"
          DIR=/mnt/debian-sources
          sudo mkdir -p "$DIR" /mnt/debian-sources-parts
          sudo chown "$(id -u):$(id -g)" "$DIR" /mnt/debian-sources-parts
          cp debian-sources.txt "$DIR/SOURCES.txt"
          echo "::notice::Platz vorher: $(df -h --output=avail /mnt | tail -1) frei auf /mnt"
          # Fehlende Quellen alle melden (Annotationen), nicht nur die erste.
          docker run --rm -v "$DIR:/out" -e OWNER="$(id -u):$(id -g)" debian:bookworm bash -uo pipefail -c '
            sed -i "s/^Types: deb$/Types: deb deb-src/" /etc/apt/sources.list.d/debian.sources
            apt-get update -qq || exit 1
            apt-get install -y -qq --no-install-recommends devscripts libwww-perl liblwp-protocol-https-perl libjson-perl ca-certificates >/dev/null || exit 1
            cd /out
            missing=0
            while read -r src ver; do
              apt-get source -qq --download-only "$src=$ver" </dev/null >/dev/null 2>&1 \
                || debsnap -f -d . "$src" "$ver" </dev/null >/dev/null 2>&1 \
                || { echo "::error::Quelle nicht gefunden: $src $ver"; missing=$((missing+1)); }
            done < SOURCES.txt
            chown -R "$OWNER" /out
            n=$(ls *.dsc | wc -l)
            echo "::notice::$n .dsc fuer $(wc -l < SOURCES.txt) Quellpakete, $missing fehlen"
            [ "$missing" -eq 0 ] && [ "$n" -ge "$(wc -l < SOURCES.txt)" ]
          '
          echo "::notice::Quellen: $(du -sh "$DIR" | cut -f1), frei: $(df -h --output=avail /mnt | tail -1)"
          set +e
          tar -cf - -C "$DIR" . 2>"$RUNNER_TEMP/tar.err" \
            | split -b 1900M -d -a 2 - "/mnt/debian-sources-parts/debian-sources-$ASSET.tar.part" 2>"$RUNNER_TEMP/split.err"
          rc=("${PIPESTATUS[@]}")
          set -e
          if [ "${rc[0]}" != 0 ] || [ "${rc[1]}" != 0 ]; then
            echo "::error::tar=${rc[0]} $(tail -c 400 "$RUNNER_TEMP/tar.err" | tr '\n' ' ') split=${rc[1]} $(tail -c 400 "$RUNNER_TEMP/split.err" | tr '\n' ' ')"
            exit 1
          fi
          rm -rf "$DIR" || { echo "::error::rm $DIR fehlgeschlagen: $(ls -la "$DIR" | head -5 | tr '\n' ' ')"; exit 1; }
          echo "::notice::$(ls /mnt/debian-sources-parts | wc -l) Teile, $(du -sh /mnt/debian-sources-parts | cut -f1)"

      - name: Paketliste und pandoc-Quellen an das Release haengen
        if: env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" "DEBIAN-PACKAGES-$ASSET.txt" "pandoc-sources-$ASSET.tar" /mnt/debian-sources-parts/debian-sources-"$ASSET".tar.part* --clobber

      - name: Nach ghcr.io pushen
        if: env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          IMG=ghcr.io/$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          # Release: :<version>, manueller Start: :<version>-<commit> (ASSET aus "pandoc-Quellen sammeln")
          docker tag latex-ide:test "$IMG:${ASSET#v}"
          docker push "$IMG:${ASSET#v}"
          if [ -n "$RELEASE_RUN" ]; then
            docker tag latex-ide:test "$IMG:latest"
            docker push "$IMG:latest"
          fi
          docker inspect --format '{{join .RepoDigests "\n"}}' latex-ide:test | tee -a "$GITHUB_STEP_SUMMARY"
