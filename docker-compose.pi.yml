# LaTeX IDE (Mehrbenutzer) auf einem kleinen Server (z. B. Raspberry Pi), öffentlich per
# Tailscale Funnel unter https://latex.<tailnet>.ts.net. TeX Live liegt auf dem Host.
#   docker compose -f docker-compose.pi.yml up -d --build
# TeX Live + Daten am besten auf SSD statt SD-Karte. Nutzerdaten: nur verschluesselt auf der SSD
# (${LATEX_DATA_DIR}/vault), Klartext nur im RAM (tmpfs unter /app/data). Einmal-Migration
# und Schluessel: siehe README "Verschluesselte Daten".
services:
  app:
    build:
      context: .
      args:
        TEXLIVE: host
    image: latex-collab
    container_name: latex-collab
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    # Kompilieren ist teuer: begrenzt, damit andere Dienste daneben Luft haben.
    mem_limit: ${LATEX_MEM:-1g}
    memswap_limit: ${LATEX_MEM:-1g}
    cpus: ${LATEX_CPUS:-2}
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    env_file: .env
    environment:
      # env_file reicht die ganze .env durch; der Tailscale-Schluessel gehoert nur in den tailscale-Container.
      TS_AUTHKEY: ""
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET fehlt in .env}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?ADMIN_EMAIL fehlt in .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD fehlt in .env}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      PUBLIC_URL: ${PUBLIC_URL:?PUBLIC_URL fehlt in .env}
      COOKIE_SECURE: "true"
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_SECURE: ${SMTP_SECURE:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      TZ: ${TZ:-Europe/Berlin}
      # Update-Banner fuer Admins: off | notify | button | auto (siehe scripts/server-update.sh)
      UPDATE_MODE: ${UPDATE_MODE:-notify}
      UPDATE_TOKEN: ${UPDATE_TOKEN:-}
      UPDATE_REPO: ${UPDATE_REPO:-}
      SOURCE_URL: ${SOURCE_URL:-}
      LANGUAGETOOL_URL: ${LANGUAGETOOL_URL:-}
      DATA_KEY: ${DATA_KEY:?DATA_KEY fehlt in .env (node server/lib/vault.js keygen)}
      VAULT_DIR: /vault
      NODE_OPTIONS: --max-old-space-size=${LATEX_HEAP_MB:-384}
    # Arbeitsverzeichnis im RAM. tmpfs-Nutzung zaehlt zum mem_limit des Containers.
    # size = Obergrenze fuer Projekte + Sitzungen + Yjs-Staende + Build-Ausgaben (Rest bleibt
    # fuer Node/TeX): LATEX_TMPFS und LATEX_MEM passend zur Datenmenge waehlen.
    tmpfs:
      - /app/data:size=${LATEX_TMPFS:-512m},uid=1000,gid=1000,mode=0700
    volumes:
      # Verschluesselter Speicher (muss dem Container-User node, uid 1000, gehoeren)
      - ${LATEX_DATA_DIR:?LATEX_DATA_DIR fehlt - muss auf die SSD zeigen}/vault:/vault
      - ${LATEX_TEXLIVE_DIR:?LATEX_TEXLIVE_DIR fehlt}:/data/texlive:ro
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3077/healthz').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    ports:
      # Nur zum Prüfen auf dem Pi selbst (ssh -L 8095:127.0.0.1:8095 ...).
      - "127.0.0.1:8095:3077"

  tailscale:
    image: tailscale/tailscale:v1.104.4
    container_name: latex-tailscale
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    mem_limit: 256m
    memswap_limit: 256m
    hostname: latex
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:-}
      TS_HOSTNAME: latex
      TS_USERSPACE: "true"
      TS_STATE_DIR: /var/lib/tailscale
      TS_SERVE_CONFIG: /config/serve.json
    volumes:
      - tsstate:/var/lib/tailscale
      - ./tailscale-serve.json:/config/serve.json:ro
    depends_on:
      - app

volumes:
  tsstate:
