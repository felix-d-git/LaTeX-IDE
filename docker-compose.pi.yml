services:
  latex-ide:
    build: ./app
    container_name: latex-ide
    restart: "no"
    mem_limit: 1.5g
    mem_reservation: 512m
    cpus: 3.5
    ports:
      - "3078:3077"
    volumes:
      - /srv/latex-alt/projects:/app/projects
      - /srv/latex-alt/workspace.json:/app/workspace.json
      - /srv/latex-alt/auth-data.json:/app/auth-data.json
      - /srv/latex-alt/sessions:/app/.sessions
      - /srv/latex-alt/mail-outbox.log:/app/mail-outbox.log
    env_file:
      - .env
